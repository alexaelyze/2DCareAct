    <style>
    /* SIDE IMAGES */
    .side-img {
        position: fixed;
        bottom: 80px;
        height: 75%;
        max-height: 100%;
        z-index: 0;
    }

    .left-img {
        left: 0;
    }

    .right-img {
        right: 0;
    }

    /* keep content above images */
    .whitebox, .center {
        position: relative;
        z-index: 1;
    }
    
    /* TABLET */
@media (max-width: 1024px) {

  .side-img {
    height: 60%;
    opacity: 0.4; /* soften so it doesn't dominate */
  }

  .center {
    width: 25% !important;
  }

}

/* MOBILE */
@media (max-width: 600px) {

  /* Hide side images (they break layout on phones) */
  .side-img {
    display: none;
  }

  /* Center logo properly */
  .center {
    width: 40% !important;
    display: block;
    margin: 40px auto 20px auto;
  }

  /* Fix whitebox spacing */
  .whitebox {
    width: 90%;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }

  /* Buttons full width */
  .button {
    width: 100%;
    max-width: 250px;
  }

}

  padding: 15px 20px;

/* MOBILE */
